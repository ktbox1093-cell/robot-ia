name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Generar proyecto Android
        run: |
          mkdir -p app/src/main/java/com/robotia/app

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "RobotIA"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.robotia.app"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.robotia.app"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "0.1"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <application
                  android:label="Robot IA"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".OverlayService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="overlay"/>
                  </service>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/robotia/app/MainActivity.kt <<'EOF'
          package com.robotia.app

          import android.app.Activity
          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.widget.Button
          import android.widget.LinearLayout

          class MainActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  if (Build.VERSION.SDK_INT >= 33) {
                      requestPermissions(arrayOf("android.permission.POST_NOTIFICATIONS"), 1)
                  }
                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                  }
                  val start = Button(this).apply { text = "Despertar ojos" }
                  val stop = Button(this).apply { text = "Dormir ojos" }
                  start.setOnClickListener {
                      if (!Settings.canDrawOverlays(this)) {
                          startActivity(
                              Intent(
                                  Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                                  Uri.parse("package:$packageName")
                              )
                          )
                      } else {
                          startForegroundService(Intent(this, OverlayService::class.java))
                      }
                  }
                  stop.setOnClickListener {
                      stopService(Intent(this, OverlayService::class.java))
                  }
                  layout.addView(start)
                  layout.addView(stop)
                  setContentView(layout)
              }
          }
          EOF

          cat > app/src/main/java/com/robotia/app/OverlayService.kt <<'EOF'
          package com.robotia.app

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Intent
          import android.graphics.PixelFormat
          import android.os.IBinder
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.WindowManager

          class OverlayService : Service() {
              private lateinit var wm: WindowManager
              private var eyes: EyesView? = null

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  val channel = "robot"
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(
                      NotificationChannel(channel, "Robot IA", NotificationManager.IMPORTANCE_LOW)
                  )
                  val notif = Notification.Builder(this, channel)
                      .setContentTitle("Robot IA despierto")
                      .setSmallIcon(android.R.drawable.ic_dialog_info)
                      .build()
                  startForeground(1, notif)

                  wm = getSystemService(WINDOW_SERVICE) as WindowManager
                  val params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  )
                  params.gravity = Gravity.TOP or Gravity.START
                  params.x = 300
                  params.y = 60

                  val view = EyesView(this)
                  var startX = 0
                  var startY = 0
                  var touchX = 0f
                  var touchY = 0f
                  view.setOnTouchListener { _, e ->
                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> {
                              startX = params.x
                              startY = params.y
                              touchX = e.rawX
                              touchY = e.rawY
                          }
                          MotionEvent.ACTION_MOVE -> {
                              params.x = startX + (e.rawX - touchX).toInt()
                              params.y = startY + (e.rawY - touchY).toInt()
                              wm.updateViewLayout(view, params)
                          }
                      }
                      true
                  }
                  eyes = view
                  wm.addView(view, params)
              }

              override fun onDestroy() {
                  eyes?.let {
                      it.stopBlinking()
                      wm.removeView(it)
                  }
                  super.onDestroy()
              }
          }
          EOF

          cat > app/src/main/java/com/robotia/app/EyesView.kt <<'EOF'
          package com.robotia.app

          import android.animation.ValueAnimator
          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.os.Handler
          import android.os.Looper
          import android.view.View

          class EyesView(ctx: Context) : View(ctx) {
              private val white = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.WHITE }
              private val pupil = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.rgb(20, 20, 40) }
              private val bg = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.argb(230, 15, 15, 30) }
              private val density = ctx.resources.displayMetrics.density
              private var open = 1f
              private var look = 0f
              private val handler = Handler(Looper.getMainLooper())

              private val loop = object : Runnable {
                  override fun run() {
                      val a = ValueAnimator.ofFloat(1f, 0.05f, 1f)
                      a.duration = 220
                      a.addUpdateListener {
                          open = it.animatedValue as Float
                          invalidate()
                      }
                      a.start()
                      look = (-1..1).random().toFloat()
                      handler.postDelayed(this, (2500..5500).random().toLong())
                  }
              }

              init {
                  handler.post(loop)
              }

              fun stopBlinking() {
                  handler.removeCallbacks(loop)
              }

              override fun onMeasure(w: Int, h: Int) {
                  setMeasuredDimension((150 * density).toInt(), (70 * density).toInt())
              }

              override fun onDraw(c: Canvas) {
                  val w = width.toFloat()
                  val h = height.toFloat()
                  c.drawRoundRect(0f, 0f, w, h, h / 2, h / 2, bg)
                  val r = h * 0.32f
                  val cy = h / 2
                  for (cx in floatArrayOf(w * 0.3f, w * 0.7f)) {
                      c.save()
                      c.scale(1f, open, cx, cy)
                      c.drawCircle(cx, cy, r, white)
                      c.drawCircle(cx + look * r * 0.35f, cy, r * 0.5f, pupil)
                      c.restore()
                  }
              }
          }
          EOF

      - name: Compilar APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: robot-ia-apk
          path: app/build/outputs/apk/debug/app-debug.apk
