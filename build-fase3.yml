name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Generar proyecto Android
        run: |
          mkdir -p app/src/main/java/com/robotia/app

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "RobotIA"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.robotia.app"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.robotia.app"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 6
                  versionName = "0.6"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_CAMERA"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-feature android:name="android.hardware.camera" android:required="false"/>
              <queries>
                  <intent><action android:name="android.speech.RecognitionService"/></intent>
                  <intent><action android:name="android.intent.action.TTS_SERVICE"/></intent>
              </queries>
              <application
                  android:label="Robot IA"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".OverlayService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse|microphone|camera">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="overlay"/>
                  </service>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/robotia/app/Llm.kt <<'EOF'
          package com.robotia.app

          import org.json.JSONArray
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL

          object Llm {
              class LlmError(val code: Int, message: String) : Exception(message)

              fun base(p: String): String =
                  if (p == "mistral") "https://api.mistral.ai/v1" else "https://api.groq.com/openai/v1"

              fun defaultModel(p: String): String =
                  if (p == "mistral") "mistral-small-latest" else "llama-3.3-70b-versatile"

              fun clean(key: String): String =
                  key.filter { !it.isWhitespace() && it != '"' && it != '\'' }

              private fun http(p: String, path: String, key: String, body: JSONObject?): String {
                  val c = URL(base(p) + path).openConnection() as HttpURLConnection
                  c.connectTimeout = 15000
                  c.readTimeout = 40000
                  c.setRequestProperty("Authorization", "Bearer " + key)
                  c.setRequestProperty("Accept", "application/json")
                  c.setRequestProperty("User-Agent", "Mozilla/5.0 (Linux; Android) RobotIA/0.6")
                  if (body != null) {
                      c.requestMethod = "POST"
                      c.setRequestProperty("Content-Type", "application/json")
                      c.doOutput = true
                      c.outputStream.use { it.write(body.toString().toByteArray()) }
                  }
                  val code = c.responseCode
                  val stream = if (code in 200..299) c.inputStream else c.errorStream
                  val txt = stream?.bufferedReader()?.use { it.readText() } ?: ""
                  if (code !in 200..299) {
                      val msg = try {
                          val o = JSONObject(txt)
                          o.optJSONObject("error")?.optString("message")?.takeIf { it.isNotBlank() }
                              ?: o.optString("message").ifBlank { txt.take(200) }
                      } catch (e: Exception) {
                          txt.take(200)
                      }
                      throw LlmError(code, "HTTP " + code + ": " + msg)
                  }
                  return txt
              }

              fun pickModel(p: String, key: String): String {
                  if (key.isBlank()) throw Exception("falta la clave de API")
                  val arr = JSONObject(http(p, "/models", key, null)).optJSONArray("data")
                      ?: throw Exception("la lista de modelos vino vacia")
                  val bad = listOf(
                      "whisper", "guard", "tts", "embed", "moderation", "ocr", "audio",
                      "orpheus", "playai", "vision", "transcribe", "codestral", "pixtral", "voxtral"
                  )
                  val ids = ArrayList<String>()
                  for (n in 0 until arr.length()) {
                      val id = arr.getJSONObject(n).optString("id")
                      if (id.isNotBlank() && bad.none { id.contains(it) }) ids.add(id)
                  }
                  if (ids.isEmpty()) throw Exception("no hay modelos de chat disponibles para esta clave")
                  val wanted = if (p == "mistral") {
                      listOf("mistral-small-latest", "small", "ministral", "medium")
                  } else {
                      listOf("llama-3.3-70b", "llama-3.1-8b", "gpt-oss-20b", "gpt-oss-120b", "llama")
                  }
                  for (w in wanted) {
                      val hit = ids.firstOrNull { it.contains(w) }
                      if (hit != null) return hit
                  }
                  return ids.first()
              }

              fun chat(p: String, key: String, model: String, system: String, msgs: JSONArray): String {
                  val all = JSONArray().put(JSONObject().put("role", "system").put("content", system))
                  for (n in 0 until msgs.length()) all.put(msgs.getJSONObject(n))
                  val body = JSONObject()
                      .put("model", model)
                      .put("messages", all)
                      .put("max_tokens", 600)
                  val txt = http(p, "/chat/completions", key, body)
                  val out = JSONObject(txt)
                      .optJSONArray("choices")
                      ?.optJSONObject(0)
                      ?.optJSONObject("message")
                      ?.optString("content")
                  if (out.isNullOrBlank()) throw Exception("el servicio no devolvio respuesta")
                  return out
              }
          }
          EOF

          cat > app/src/main/java/com/robotia/app/MainActivity.kt <<'EOF'
          package com.robotia.app

          import android.Manifest
          import android.app.Activity
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.text.InputType
          import android.view.Gravity
          import android.view.View
          import android.widget.AdapterView
          import android.widget.ArrayAdapter
          import android.widget.Button
          import android.widget.CheckBox
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.Spinner
          import android.widget.TextView
          import org.json.JSONArray
          import org.json.JSONObject

          class MainActivity : Activity() {
              private lateinit var result: TextView
              private val prefs by lazy { getSharedPreferences("robot", MODE_PRIVATE) }
              private val providers = listOf("groq", "mistral")
              private var current: String? = null

              override fun onResume() {
                  super.onResume()
                  val err = prefs.getString("lasterror", "") ?: ""
                  if (err.isNotBlank()) result.text = "Ultimo error del robot: " + err
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val perms = mutableListOf(
                      Manifest.permission.RECORD_AUDIO,
                      Manifest.permission.CAMERA
                  )
                  if (Build.VERSION.SDK_INT >= 33) perms.add("android.permission.POST_NOTIFICATIONS")
                  requestPermissions(perms.toTypedArray(), 1)

                  val pad = (24 * resources.displayMetrics.density).toInt()
                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setPadding(pad, pad, pad, pad)
                  }
                  val info = TextView(this).apply {
                      text = "1) Elige el servicio y pega tu clave. 2) Toca Probar clave. 3) Despierta los ojos: tocalos para hablar y ellos te siguen con la mirada."
                  }
                  val spinner = Spinner(this)
                  spinner.adapter = ArrayAdapter(
                      this,
                      android.R.layout.simple_spinner_dropdown_item,
                      listOf("Groq", "Mistral")
                  )
                  val keyBox = EditText(this).apply {
                      hint = "clave de API"
                      inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_VARIATION_PASSWORD
                  }
                  val modelBox = EditText(this).apply { hint = "modelo (se rellena solo)" }
                  val track = CheckBox(this).apply {
                      text = "Seguir mi cara con la camara frontal (gasta mas bateria)"
                      isChecked = prefs.getBoolean("track", true)
                  }
                  result = TextView(this)
                  val test = Button(this).apply { text = "Probar clave" }
                  val start = Button(this).apply { text = "Despertar ojos" }
                  val stop = Button(this).apply { text = "Dormir ojos" }

                  fun saveCurrent() {
                      prefs.edit().putBoolean("track", track.isChecked).apply()
                      val c = current ?: return
                      prefs.edit()
                          .putString("key_" + c, Llm.clean(keyBox.text.toString()))
                          .putString("model_" + c, modelBox.text.toString().trim())
                          .putString("provider", c)
                          .apply()
                  }

                  spinner.onItemSelectedListener = object : AdapterView.OnItemSelectedListener {
                      override fun onItemSelected(parent: AdapterView<*>?, v: View?, pos: Int, id: Long) {
                          saveCurrent()
                          val p = providers[pos]
                          current = p
                          keyBox.setText(prefs.getString("key_" + p, ""))
                          modelBox.setText(prefs.getString("model_" + p, ""))
                          modelBox.hint = Llm.defaultModel(p)
                          prefs.edit().putString("provider", p).apply()
                      }
                      override fun onNothingSelected(parent: AdapterView<*>?) {}
                  }
                  val saved = prefs.getString("provider", "groq") ?: "groq"
                  spinner.setSelection(providers.indexOf(saved).coerceAtLeast(0))

                  test.setOnClickListener {
                      saveCurrent()
                      val p = current ?: "groq"
                      val key = Llm.clean(keyBox.text.toString())
                      val typed = modelBox.text.toString().trim()
                      result.text = "Probando..."
                      Thread {
                          val out = try {
                              val q = JSONArray().put(
                                  JSONObject().put("role", "user").put("content", "Di hola en una frase corta")
                              )
                              var m = typed.ifBlank { Llm.defaultModel(p) }
                              val r = try {
                                  Llm.chat(p, key, m, "Responde en espanol", q)
                              } catch (e: Llm.LlmError) {
                                  if (e.code != 400 && e.code != 404) throw e
                                  m = Llm.pickModel(p, key)
                                  Llm.chat(p, key, m, "Responde en espanol", q)
                              }
                              val finalModel = m
                              prefs.edit().putString("model_" + p, finalModel).remove("lasterror").apply()
                              runOnUiThread { modelBox.setText(finalModel) }
                              "FUNCIONA con " + p + ". Modelo: " + finalModel + ". Respuesta: " + r
                          } catch (e: Exception) {
                              "FALLO: " + e.message
                          }
                          runOnUiThread { result.text = out }
                      }.start()
                  }

                  start.setOnClickListener {
                      saveCurrent()
                      if (!Settings.canDrawOverlays(this)) {
                          startActivity(
                              Intent(
                                  Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                                  Uri.parse("package:$packageName")
                              )
                          )
                      } else if (checkSelfPermission(Manifest.permission.RECORD_AUDIO)
                          != PackageManager.PERMISSION_GRANTED
                      ) {
                          requestPermissions(
                              arrayOf(Manifest.permission.RECORD_AUDIO, Manifest.permission.CAMERA),
                              2
                          )
                      } else {
                          startForegroundService(Intent(this, OverlayService::class.java))
                      }
                  }
                  stop.setOnClickListener {
                      stopService(Intent(this, OverlayService::class.java))
                  }
                  layout.addView(info)
                  layout.addView(spinner)
                  layout.addView(keyBox)
                  layout.addView(modelBox)
                  layout.addView(track)
                  layout.addView(test)
                  layout.addView(result)
                  layout.addView(start)
                  layout.addView(stop)
                  setContentView(ScrollView(this).apply { addView(layout) })
              }
          }
          EOF

          cat > app/src/main/java/com/robotia/app/OverlayService.kt <<'EOF'
          package com.robotia.app

          import android.Manifest
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.content.pm.ServiceInfo
          import android.graphics.Bitmap
          import android.graphics.ImageFormat
          import android.graphics.PixelFormat
          import android.graphics.PointF
          import android.hardware.camera2.CameraCaptureSession
          import android.hardware.camera2.CameraCharacteristics
          import android.hardware.camera2.CameraDevice
          import android.hardware.camera2.CameraManager
          import android.media.FaceDetector
          import android.media.Image
          import android.media.ImageReader
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.HandlerThread
          import android.os.IBinder
          import android.os.Looper
          import android.speech.RecognitionListener
          import android.speech.RecognizerIntent
          import android.speech.SpeechRecognizer
          import android.speech.tts.TextToSpeech
          import android.speech.tts.UtteranceProgressListener
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.WindowManager
          import android.widget.Toast
          import org.json.JSONArray
          import org.json.JSONObject
          import java.nio.ShortBuffer
          import java.util.Locale
          import kotlin.math.abs

          class OverlayService : Service() {
              companion object {
                  const val SYSTEM = "Eres Robot IA, un asistente que vive en el celular del usuario como dos ojos flotantes. Responde en espanol, en una o dos frases cortas, porque tus respuestas se leen en voz alta. No uses listas ni simbolos."
              }

              private lateinit var wm: WindowManager
              private lateinit var eyes: EyesView
              private val handler = Handler(Looper.getMainLooper())
              private var recognizer: SpeechRecognizer? = null
              private var tts: TextToSpeech? = null
              private val history = JSONArray()
              private var turn = 0

              private var camera: CameraDevice? = null
              private var session: CameraCaptureSession? = null
              private var reader: ImageReader? = null
              private var camThread: HandlerThread? = null
              private var detector: FaceDetector? = null
              private var detW = 0
              private var detH = 0
              private var lastFace = 0L
              private var lastSeen = 0L

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  val channel = "robot"
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(
                      NotificationChannel(channel, "Robot IA", NotificationManager.IMPORTANCE_LOW)
                  )
                  val notif = Notification.Builder(this, channel)
                      .setContentTitle("Robot IA despierto")
                      .setSmallIcon(android.R.drawable.ic_dialog_info)
                      .build()
                  val prefs = getSharedPreferences("robot", MODE_PRIVATE)
                  val camOk = prefs.getBoolean("track", true) &&
                      checkSelfPermission(Manifest.permission.CAMERA) == PackageManager.PERMISSION_GRANTED
                  if (Build.VERSION.SDK_INT >= 29) {
                      var types = ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE
                      if (Build.VERSION.SDK_INT >= 34) {
                          types = types or ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE
                      }
                      if (camOk) types = types or ServiceInfo.FOREGROUND_SERVICE_TYPE_CAMERA
                      startForeground(1, notif, types)
                  } else {
                      startForeground(1, notif)
                  }

                  tts = TextToSpeech(this) { status ->
                      if (status == TextToSpeech.SUCCESS) {
                          tts?.language = Locale.getDefault()
                          tts?.setOnUtteranceProgressListener(object : UtteranceProgressListener() {
                              override fun onStart(id: String?) {}
                              override fun onDone(id: String?) {
                                  handler.post { eyes.state = EyesView.IDLE }
                              }
                              @Deprecated("Deprecated in Java")
                              override fun onError(id: String?) {
                                  handler.post { eyes.state = EyesView.IDLE }
                              }
                          })
                      }
                  }

                  wm = getSystemService(WINDOW_SERVICE) as WindowManager
                  val params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  )
                  params.gravity = Gravity.TOP or Gravity.START
                  params.x = 300
                  params.y = 60

                  eyes = EyesView(this)
                  var startX = 0
                  var startY = 0
                  var touchX = 0f
                  var touchY = 0f
                  var moved = false
                  eyes.setOnTouchListener { _, e ->
                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> {
                              startX = params.x
                              startY = params.y
                              touchX = e.rawX
                              touchY = e.rawY
                              moved = false
                          }
                          MotionEvent.ACTION_MOVE -> {
                              val dx = (e.rawX - touchX).toInt()
                              val dy = (e.rawY - touchY).toInt()
                              if (abs(dx) > 15 || abs(dy) > 15) moved = true
                              params.x = startX + dx
                              params.y = startY + dy
                              wm.updateViewLayout(eyes, params)
                          }
                          MotionEvent.ACTION_UP -> {
                              if (!moved) onTap()
                          }
                      }
                      true
                  }
                  wm.addView(eyes, params)

                  if (camOk) startCamera()
              }

              @Suppress("DEPRECATION")
              private fun startCamera() {
                  try {
                      val cm = getSystemService(CameraManager::class.java)
                      val id = cm.cameraIdList.firstOrNull {
                          cm.getCameraCharacteristics(it).get(CameraCharacteristics.LENS_FACING) ==
                              CameraCharacteristics.LENS_FACING_FRONT
                      } ?: return
                      val ch = cm.getCameraCharacteristics(id)
                      val rot = ch.get(CameraCharacteristics.SENSOR_ORIENTATION) ?: 270
                      val sizes = ch.get(CameraCharacteristics.SCALER_STREAM_CONFIGURATION_MAP)
                          ?.getOutputSizes(ImageFormat.YUV_420_888) ?: return
                      val size = sizes
                          .filter { it.width >= 320 && it.height >= 240 }
                          .minByOrNull { it.width * it.height } ?: sizes.first()
                      val step = maxOf(1, size.width / 320)
                      val ht = HandlerThread("cam")
                      ht.start()
                      camThread = ht
                      val bg = Handler(ht.looper)
                      cm.openCamera(id, object : CameraDevice.StateCallback() {
                          override fun onOpened(cam: CameraDevice) {
                              if (camThread == null) {
                                  cam.close()
                                  return
                              }
                              camera = cam
                              try {
                                  val ir = ImageReader.newInstance(
                                      size.width, size.height, ImageFormat.YUV_420_888, 2
                                  )
                                  reader = ir
                                  ir.setOnImageAvailableListener({ r ->
                                      var img: Image? = null
                                      try {
                                          img = r.acquireLatestImage()
                                          val now = System.currentTimeMillis()
                                          if (img != null && now - lastFace >= 250) {
                                              lastFace = now
                                              processImage(img, rot, step)
                                          }
                                      } catch (e: Exception) {
                                      } finally {
                                          img?.close()
                                      }
                                  }, bg)
                                  cam.createCaptureSession(
                                      listOf(ir.surface),
                                      object : CameraCaptureSession.StateCallback() {
                                          override fun onConfigured(s: CameraCaptureSession) {
                                              session = s
                                              try {
                                                  val req = cam.createCaptureRequest(CameraDevice.TEMPLATE_PREVIEW)
                                                  req.addTarget(ir.surface)
                                                  s.setRepeatingRequest(req.build(), null, bg)
                                              } catch (e: Exception) {
                                              }
                                          }
                                          override fun onConfigureFailed(s: CameraCaptureSession) {}
                                      },
                                      bg
                                  )
                              } catch (e: Exception) {
                              }
                          }
                          override fun onDisconnected(cam: CameraDevice) {
                              cam.close()
                          }
                          override fun onError(cam: CameraDevice, error: Int) {
                              cam.close()
                          }
                      }, bg)
                  } catch (e: Exception) {
                  }
              }

              private fun processImage(img: Image, rot: Int, step: Int) {
                  val plane = img.planes[0]
                  val buf = plane.buffer
                  val rs = plane.rowStride
                  val ps = plane.pixelStride
                  val sw = img.width / step
                  val sh = img.height / step
                  val sideways = rot == 90 || rot == 270
                  val uw0 = if (sideways) sh else sw
                  val uh = if (sideways) sw else sh
                  val uw = uw0 - uw0 % 2
                  if (uw < 40 || uh < 40) return
                  val px = ShortArray(uw * uh)
                  for (yu in 0 until uh) {
                      for (xu in 0 until uw) {
                          val xs: Int
                          val ys: Int
                          when (rot) {
                              90 -> {
                                  xs = yu
                                  ys = sh - 1 - xu
                              }
                              270 -> {
                                  xs = sw - 1 - yu
                                  ys = xu
                              }
                              180 -> {
                                  xs = sw - 1 - xu
                                  ys = sh - 1 - yu
                              }
                              else -> {
                                  xs = xu
                                  ys = yu
                              }
                          }
                          val v = buf.get(ys * step * rs + xs * step * ps).toInt() and 0xFF
                          px[yu * uw + xu] =
                              (((v shr 3) shl 11) or ((v shr 2) shl 5) or (v shr 3)).toShort()
                      }
                  }
                  val bmp = Bitmap.createBitmap(uw, uh, Bitmap.Config.RGB_565)
                  bmp.copyPixelsFromBuffer(ShortBuffer.wrap(px))
                  val cached = detector
                  val det = if (cached != null && detW == uw && detH == uh) {
                      cached
                  } else {
                      FaceDetector(uw, uh, 1).also {
                          detector = it
                          detW = uw
                          detH = uh
                      }
                  }
                  val faces = arrayOfNulls<FaceDetector.Face>(1)
                  val n = det.findFaces(bmp, faces)
                  bmp.recycle()
                  val f = faces[0]
                  val now = System.currentTimeMillis()
                  if (n > 0 && f != null && f.confidence() > 0.4f) {
                      val p = PointF()
                      f.getMidPoint(p)
                      val x = ((0.5f - p.x / uw) * 2f).coerceIn(-1f, 1f)
                      val y = ((p.y / uh - 0.5f) * 2f).coerceIn(-1f, 1f)
                      lastSeen = now
                      handler.post { eyes.lookAt(x, y) }
                  } else if (lastSeen != 0L && now - lastSeen > 3000) {
                      lastSeen = 0L
                      handler.post { eyes.idleLook() }
                  }
              }

              private fun stopCamera() {
                  try { session?.close() } catch (e: Exception) {}
                  try { camera?.close() } catch (e: Exception) {}
                  try { reader?.close() } catch (e: Exception) {}
                  camThread?.quitSafely()
                  session = null
                  camera = null
                  reader = null
                  camThread = null
              }

              private fun onTap() {
                  if (eyes.state == EyesView.IDLE) listen() else stopAll()
              }

              private fun stopAll() {
                  turn++
                  recognizer?.destroy()
                  recognizer = null
                  tts?.stop()
                  eyes.state = EyesView.IDLE
              }

              private fun listen() {
                  if (!SpeechRecognizer.isRecognitionAvailable(this)) {
                      speak("No tengo reconocimiento de voz en este celular")
                      return
                  }
                  recognizer?.destroy()
                  val r = SpeechRecognizer.createSpeechRecognizer(this)
                  recognizer = r
                  r.setRecognitionListener(object : RecognitionListener {
                      override fun onReadyForSpeech(p: Bundle?) {}
                      override fun onBeginningOfSpeech() {}
                      override fun onRmsChanged(v: Float) {}
                      override fun onBufferReceived(b: ByteArray?) {}
                      override fun onEndOfSpeech() {}
                      override fun onError(error: Int) {
                          eyes.state = EyesView.IDLE
                      }
                      override fun onResults(res: Bundle?) {
                          val text = res
                              ?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)
                              ?.firstOrNull()
                          if (text.isNullOrBlank()) {
                              eyes.state = EyesView.IDLE
                          } else {
                              ask(text)
                          }
                      }
                      override fun onPartialResults(p: Bundle?) {}
                      override fun onEvent(type: Int, p: Bundle?) {}
                  })
                  val i = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH)
                  i.putExtra(
                      RecognizerIntent.EXTRA_LANGUAGE_MODEL,
                      RecognizerIntent.LANGUAGE_MODEL_FREE_FORM
                  )
                  i.putExtra(RecognizerIntent.EXTRA_LANGUAGE, Locale.getDefault().toLanguageTag())
                  eyes.state = EyesView.LISTENING
                  r.startListening(i)
              }

              private fun msg(role: String, text: String): JSONObject =
                  JSONObject().put("role", role).put("content", text)

              private fun callLlm(msgs: JSONArray): String {
                  val prefs = getSharedPreferences("robot", MODE_PRIVATE)
                  val p = prefs.getString("provider", "groq") ?: "groq"
                  val key = Llm.clean(prefs.getString("key_" + p, "") ?: "")
                  if (key.isBlank()) throw Exception("falta la clave de API en la app")
                  var model = prefs.getString("model_" + p, "") ?: ""
                  if (model.isBlank()) model = Llm.defaultModel(p)
                  return try {
                      Llm.chat(p, key, model, SYSTEM, msgs)
                  } catch (e: Llm.LlmError) {
                      if (e.code != 400 && e.code != 404) throw e
                      val m = Llm.pickModel(p, key)
                      if (m == model) throw e
                      prefs.edit().putString("model_" + p, m).apply()
                      Llm.chat(p, key, m, SYSTEM, msgs)
                  }
              }

              private fun ask(text: String) {
                  eyes.state = EyesView.THINKING
                  history.put(msg("user", text))
                  val prefs = getSharedPreferences("robot", MODE_PRIVATE)
                  val msgs = JSONArray(history.toString())
                  val mine = ++turn
                  Thread {
                      var err: String? = null
                      val reply = try {
                          callLlm(msgs)
                      } catch (e: Exception) {
                          err = e.message ?: "error desconocido"
                          "Tuve un problema. Mira el mensaje en pantalla."
                      }
                      handler.post {
                          if (mine == turn) {
                              val f = err
                              if (f == null) {
                                  history.put(msg("assistant", reply))
                                  prefs.edit().remove("lasterror").apply()
                              } else {
                                  history.remove(history.length() - 1)
                                  prefs.edit().putString("lasterror", f).apply()
                                  Toast.makeText(this, f, Toast.LENGTH_LONG).show()
                              }
                              while (history.length() > 20) {
                                  history.remove(0)
                                  history.remove(0)
                              }
                              speak(reply)
                          }
                      }
                  }.start()
              }

              private fun speak(text: String) {
                  eyes.state = EyesView.SPEAKING
                  tts?.speak(text, TextToSpeech.QUEUE_FLUSH, null, "robot")
              }

              override fun onDestroy() {
                  turn++
                  stopCamera()
                  recognizer?.destroy()
                  tts?.shutdown()
                  if (::eyes.isInitialized) {
                      eyes.stopBlinking()
                      wm.removeView(eyes)
                  }
                  super.onDestroy()
              }
          }
          EOF

          cat > app/src/main/java/com/robotia/app/EyesView.kt <<'EOF'
          package com.robotia.app

          import android.animation.ValueAnimator
          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.os.Handler
          import android.os.Looper
          import android.view.View

          class EyesView(ctx: Context) : View(ctx) {
              companion object {
                  const val IDLE = 0
                  const val LISTENING = 1
                  const val THINKING = 2
                  const val SPEAKING = 3
              }

              private val white = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.WHITE }
              private val pupil = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.rgb(20, 20, 40) }
              private val bg = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.argb(230, 15, 15, 30) }
              private val density = ctx.resources.displayMetrics.density
              private var open = 1f
              private var lx = 0f
              private var ly = 0f
              private var tracking = false
              private val handler = Handler(Looper.getMainLooper())

              var state = IDLE
                  set(v) {
                      field = v
                      pupil.color = when (v) {
                          LISTENING -> Color.rgb(30, 120, 255)
                          THINKING -> Color.rgb(255, 170, 0)
                          SPEAKING -> Color.rgb(0, 170, 90)
                          else -> Color.rgb(20, 20, 40)
                      }
                      invalidate()
                  }

              fun lookAt(x: Float, y: Float) {
                  tracking = true
                  val sx = lx
                  val sy = ly
                  val a = ValueAnimator.ofFloat(0f, 1f)
                  a.duration = 200
                  a.addUpdateListener {
                      val t = it.animatedValue as Float
                      lx = sx + (x - sx) * t
                      ly = sy + (y - sy) * t
                      invalidate()
                  }
                  a.start()
              }

              fun idleLook() {
                  tracking = false
              }

              private val loop = object : Runnable {
                  override fun run() {
                      val a = ValueAnimator.ofFloat(1f, 0.05f, 1f)
                      a.duration = 220
                      a.addUpdateListener {
                          open = it.animatedValue as Float
                          invalidate()
                      }
                      a.start()
                      if (!tracking) {
                          lx = (-1..1).random().toFloat() * 0.8f
                          ly = 0f
                      }
                      handler.postDelayed(this, (2500..5500).random().toLong())
                  }
              }

              init {
                  handler.post(loop)
              }

              fun stopBlinking() {
                  handler.removeCallbacks(loop)
              }

              override fun onMeasure(w: Int, h: Int) {
                  setMeasuredDimension((150 * density).toInt(), (70 * density).toInt())
              }

              override fun onDraw(c: Canvas) {
                  val w = width.toFloat()
                  val h = height.toFloat()
                  c.drawRoundRect(0f, 0f, w, h, h / 2, h / 2, bg)
                  val r = h * 0.32f
                  val pr = if (state == LISTENING) r * 0.65f else r * 0.5f
                  val cy = h / 2
                  for (cx in floatArrayOf(w * 0.3f, w * 0.7f)) {
                      c.save()
                      c.scale(1f, open, cx, cy)
                      c.drawCircle(cx, cy, r, white)
                      c.drawCircle(cx + lx * r * 0.35f, cy + ly * r * 0.3f, pr, pupil)
                      c.restore()
                  }
              }
          }
