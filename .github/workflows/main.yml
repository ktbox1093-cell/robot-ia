name: Build APK Robot IA Final Store Ready

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Generar proyecto Android
        run: |
          mkdir -p app/src/main/java/com/robotia/app

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "RobotIA"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.robotia.app"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.robotia.app"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 11
                  versionName = "1.1"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_CAMERA"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.CALL_PHONE"/>
              <uses-permission android:name="android.permission.READ_CONTACTS"/>
              <uses-permission android:name="android.permission.SEND_SMS"/>
              <uses-feature android:name="android.hardware.camera" android:required="false"/>
              <queries>
                  <intent><action android:name="android.speech.RecognitionService"/></intent>
                  <intent><action android:name="android.intent.action.TTS_SERVICE"/></intent>
              </queries>
              <application
                  android:label="Robot IA"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".OverlayService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse|microphone|camera">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="overlay"/>
                  </service>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/robotia/app/Llm.kt <<'EOF'
          package com.robotia.app

          import org.json.JSONArray
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL

          object Llm {
              class LlmError(val code: Int, message: String) : Exception(message)

              fun base(p: String): String =
                  if (p == "mistral") "https://api.mistral.ai/v1" else "https://api.groq.com/openai/v1"

              fun defaultModel(p: String): String =
                  if (p == "mistral") "mistral-small-latest" else "llama-3.3-70b-versatile"

              fun clean(key: String): String =
                  key.filter { !it.isWhitespace() && it != '"' && it != '\'' }

              private fun http(p: String, path: String, key: String, body: JSONObject?): String {
                  val c = URL(base(p) + path).openConnection() as HttpURLConnection
                  c.connectTimeout = 15000
                  c.readTimeout = 40000
                  c.setRequestProperty("Authorization", "Bearer " + key)
                  c.setRequestProperty("Accept", "application/json")
                  c.setRequestProperty("User-Agent", "Mozilla/5.0 (Linux; Android) RobotIA/1.1")
                  if (body != null) {
                      c.requestMethod = "POST"
                      c.setRequestProperty("Content-Type", "application/json")
                      c.doOutput = true
                      c.outputStream.use { it.write(body.toString().toByteArray()) }
                  }
                  val code = c.responseCode
                  val stream = if (code in 200..299) c.inputStream else c.errorStream
                  val txt = stream?.bufferedReader()?.use { it.readText() } ?: ""
                  if (code !in 200..299) {
                      val msg = try {
                          val o = JSONObject(txt)
                          o.optJSONObject("error")?.optString("message")?.takeIf { it.isNotBlank() }
                              ?: o.optString("message").ifBlank { txt.take(200) }
                      } catch (e: Exception) {
                          txt.take(200)
                      }
                      throw LlmError(code, "HTTP " + code + ": " + msg)
                  }
                  return txt
              }

              fun pickModel(p: String, key: String): String {
                  if (key.isBlank()) throw Exception("falta la clave de API")
                  val arr = JSONObject(http(p, "/models", key, null)).optJSONArray("data")
                      ?: throw Exception("la lista de modelos vino vacia")
                  val bad = listOf(
                      "whisper", "guard", "tts", "embed", "moderation", "ocr", "audio",
                      "orpheus", "playai", "vision", "transcribe", "codestral", "pixtral", "voxtral"
                  )
                  val ids = ArrayList<String>()
                  for (n in 0 until arr.length()) {
                      val id = arr.getJSONObject(n).optString("id")
                      if (id.isNotBlank() && bad.none { id.contains(it) }) ids.add(id)
                  }
                  if (ids.isEmpty()) throw Exception("no hay modelos de chat disponibles para esta clave")
                  val wanted = if (p == "mistral") {
                      listOf("mistral-small-latest", "small", "ministral", "medium")
                  } else {
                      listOf("llama-3.3-70b", "llama-3.1-8b", "gpt-oss-20b", "gpt-oss-120b", "llama")
                  }
                  for (w in wanted) {
                      val hit = ids.firstOrNull { it.contains(w) }
                      if (hit != null) return hit
                  }
                  return ids.first()
              }

              fun chat(p: String, key: String, model: String, system: String, msgs: JSONArray): String {
                  val all = JSONArray().put(JSONObject().put("role", "system").put("content", system))
                  for (n in 0 until msgs.length()) all.put(msgs.getJSONObject(n))
                  val body = JSONObject()
                      .put("model", model)
                      .put("messages", all)
                      .put("max_tokens", 600)
                  val txt = http(p, "/chat/completions", key, body)
                  val out = JSONObject(txt)
                      .optJSONArray("choices")
                      ?.optJSONObject(0)
                      ?.optJSONObject("message")
                      ?.optString("content")
                  if (out.isNullOrBlank()) throw Exception("el servicio no devolvio respuesta")
                  return out
              }
          }
          EOF

          cat > app/src/main/java/com/robotia/app/EyesView.kt <<'EOF'
          package com.robotia.app

          import android.animation.ValueAnimator
          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.graphics.Path
          import android.graphics.RectF
          import android.os.Handler
          import android.os.Looper
          import android.view.View

          class EyesView(ctx: Context) : View(ctx) {
              companion object {
                  const val IDLE = 0
                  const val LISTENING = 1
                  const val THINKING = 2
                  const val SPEAKING = 3

                  val EXPR_NAMES = listOf(
                      "neutral", "feliz", "triste", "enojado",
                      "sorprendido", "amor", "sueno", "guino"
                  )
                  val COLOR_NAMES = listOf(
                      "Cian", "Verde", "Azul", "Rosa", "Naranja", "Blanco", "Rojo", "Amarillo"
                  )
                  val COLORS = intArrayOf(
                      Color.rgb(0, 229, 255), Color.rgb(60, 235, 120), Color.rgb(70, 130, 255),
                      Color.rgb(255, 110, 190), Color.rgb(255, 150, 40), Color.WHITE,
                      Color.rgb(255, 70, 70), Color.rgb(255, 220, 60)
                  )
                  val SHAPE_NAMES = listOf("Redondos", "Suaves", "Capsulas")
              }

              private val fill = Paint(Paint.ANTI_ALIAS_FLAG)
              private val bgPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.BLACK }
              private val density = ctx.resources.displayMetrics.density
              private var open = 1f
              private var lx = 0f
              private var ly = 0f
              private var tracking = false
              private val handler = Handler(Looper.getMainLooper())

              var eyeColor = COLORS[0]
              var shape = 1
              var sizeScale = 1f

              var expression = 0
                  set(v) {
                      field = v
                      invalidate()
                  }

              var state = IDLE
                  set(v) {
                      field = v
                      if (v == IDLE) expression = 0
                      invalidate()
                  }

              fun lookAt(x: Float, y: Float) {
                  tracking = true
                  val sx = lx
                  val sy = ly
                  val a = ValueAnimator.ofFloat(0f, 1f)
                  a.duration = 180
                  a.addUpdateListener {
                      val t = it.animatedValue as Float
                      lx = sx + (x - sx) * t
                      ly = sy + (y - sy) * t
                      invalidate()
                  }
                  a.start()
              }

              fun idleLook() {
                  tracking = false
              }

              private val loop = object : Runnable {
                  override fun run() {
                      val a = ValueAnimator.ofFloat(1f, 0.05f, 1f)
                      a.duration = 200
                      a.addUpdateListener {
                          open = it.animatedValue as Float
                          invalidate()
                      }
                      a.start()
                      if (!tracking) {
                          lx = (-1..1).random().toFloat() * 0.8f
                          ly = 0f
                      }
                      handler.postDelayed(this, (3500..6500).random().toLong())
                  }
              }

              init {
                  handler.post(loop)
              }

              fun stopBlinking() {
                  handler.removeCallbacks(loop)
              }

              override fun onMeasure(w: Int, h: Int) {
                  setMeasuredDimension(
                      (110 * density * sizeScale).toInt(),
                      (40 * density * sizeScale).toInt()
                  )
              }

              override fun onDraw(c: Canvas) {
                  val w = width.toFloat()
                  val h = height.toFloat()
                  c.drawRoundRect(0f, 0f, w, h, h / 2, h / 2, bgPaint)
                  var eh = h * 0.34f
                  if (state == LISTENING) eh *= 1.12f
                  if (expression == 4) eh *= 1.2f
                  val ew = when (shape) {
                      0 -> eh * 0.95f
                      2 -> eh * 0.6f
                      else -> eh * 1.05f
                  }
                  val rr = if (shape == 1) eh * 0.45f else eh
                  val cy = h / 2
                  val dx = if (state == THINKING) 0.8f else lx
                  val dy = if (state == THINKING) -0.8f else ly
                  for (i in 0..1) {
                      fill.color = eyeColor
                      val cx = (if (i == 0) w * 0.3f else w * 0.7f) + dx * eh * 0.45f
                      drawEye(c, i, cx, cy + dy * eh * 0.3f, ew, eh, rr)
                  }
              }

              private fun drawEye(
                  c: Canvas, i: Int, cx: Float, cy: Float, ew: Float, eh: Float, rr: Float
              ) {
                  val ex = expression
                  if (ex == 5) {
                      heart(c, cx, cy, eh)
                      return
                  }
                  var hh = eh * open
                  if (ex == 7 && i == 1) hh = eh * 0.12f
                  if (hh < 1f) hh = 1f
                  val rect = RectF(cx - ew, cy - hh, cx + ew, cy + hh)
                  val r = minOf(rr, ew, hh)
                  val path = Path()
                  path.addRoundRect(rect, r, r, Path.Direction.CW)
                  c.save()
                  c.clipPath(path)
                  c.drawRect(rect, fill)
                  val top = cy - hh
                  val tall = hh * 2
                  fun lid(inner: Float, outer: Float) {
                      val yl = top + tall * (if (i == 0) outer else inner)
                      val yr = top + tall * (if (i == 0) inner else outer)
                      val p = Path()
                      p.moveTo(cx - ew - 2f, top - 2f)
                      p.lineTo(cx + ew + 2f, top - 2f)
                      p.lineTo(cx + ew + 2f, yr)
                      p.lineTo(cx - ew - 2f, yl)
                      p.close()
                      c.drawPath(p, bgPaint)
                  }
                  when (ex) {
                      1 -> c.drawOval(
                          RectF(cx - ew * 1.3f, cy + hh * 0.15f, cx + ew * 1.3f, cy + hh * 2.2f),
                          bgPaint
                      )
                      2 -> lid(0.05f, 0.55f)
                      3 -> lid(0.6f, 0.05f)
                      6 -> lid(0.5f, 0.5f)
                      else -> if (state == THINKING) lid(0.2f, 0.2f)
                  }
                  c.restore()
              }

              private fun heart(c: Canvas, cx: Float, cy: Float, eh: Float) {
                  val s = eh * 0.75f * (0.85f + 0.15f * open)
                  val p = Path()
                  p.moveTo(cx, cy + s)
                  p.cubicTo(cx - s * 1.6f, cy - s * 0.2f, cx - s * 0.7f, cy - s * 1.3f, cx, cy - s * 0.45f)
                  p.cubicTo(cx + s * 0.7f, cy - s * 1.3f, cx + s * 1.6f, cy - s * 0.2f, cx, cy + s)
                  p.close()
                  fill.color = Color.rgb(255, 80, 120)
                  c.drawPath(p, fill)
                  fill.color = eyeColor
              }
          }
          EOF

          cat > app/src/main/java/com/robotia/app/OverlayService.kt <<'EOF'
          package com.robotia.app

          import android.Manifest
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Intent
          import android.content.SharedPreferences
          import android.content.pm.PackageManager
          import android.content.pm.ServiceInfo
          import android.graphics.Bitmap
          import android.graphics.ImageFormat
          import android.graphics.PixelFormat
          import android.graphics.PointF
          import android.hardware.camera2.CameraCaptureSession
          import android.hardware.camera2.CameraCharacteristics
          import android.hardware.camera2.CameraDevice
          import android.hardware.camera2.CameraManager
          import android.media.FaceDetector
          import android.media.Image
          import android.media.ImageReader
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.HandlerThread
          import android.os.IBinder
          import android.os.Looper
          import android.speech.RecognitionListener
          import android.speech.RecognizerIntent
          import android.speech.SpeechRecognizer
          import android.speech.tts.TextToSpeech
          import android.speech.tts.UtteranceProgressListener
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.WindowManager
          import android.widget.Toast
          import org.json.JSONArray
          import org.json.JSONObject
          import java.nio.ShortBuffer
          import java.text.Normalizer
          import java.util.Locale
          import kotlin.math.abs

          class OverlayService : Service() {
              companion object {
                  const val SYSTEM_BASE = "Eres Robot IA, un asistente que vive en el celular del usuario como dos ojos flotantes. Responde en espanol, en una o duas frases cortas. No uses listas ni simbolos. Empieza SIEMPRE tu respuesta con una etiqueta de emocion: [neutral], [feliz], [triste], [enojado], [sorprendido], [amor], [sueno] o [guino]. Si el usuario te pide explícitamente realizar una accion del sistema (llamar a alguien, abrir una aplicacion, poner una alarma o enviar un mensaje), incluye al final una etiqueta de accion: [ACCION:ABRIR:nombre_app], [ACCION:ALARMA:hora:minuto], [ACCION:LLAMAR:contacto] o [ACCION:MENSAJE:contacto:texto]. Si el usuario te cuenta un dato personal importante sobre él, incluye al final [MEMORIA:lo_que_dijo]."
              }

              private lateinit var wm: WindowManager
              private lateinit var params: WindowManager.LayoutParams
              private lateinit var eyes: EyesView
              private val handler = Handler(Looper.getMainLooper())
              private var recognizer: SpeechRecognizer? = null
              private var tts: TextToSpeech? = null
              private var ttsReady = false
              private val history = JSONArray()
              private var turn = 0
              private var pendingAction: String? = null

              private var camera: CameraDevice? = null
              private var session: CameraCaptureSession? = null
              private var reader: ImageReader? = null
              private var camThread: HandlerThread? = null
              private var detector: FaceDetector? = null
              private var detW = 0
              private var detH = 0
              private var lastFace = 0L
              private var lastSeen = 0L

              private val prefListener = SharedPreferences.OnSharedPreferenceChangeListener { sp, key ->
                  if (key == "preview") {
                      val name = (sp.getString("preview", "") ?: "").substringBefore("|")
                      val idx = EyesView.EXPR_NAMES.indexOf(name)
                      if (idx >= 0) {
                          handler.post {
                              eyes.expression = idx
                              handler.postDelayed({
                                  if (eyes.state == EyesView.IDLE) eyes.expression = 0
                              }, 2500)
                          }
                      }
                  } else if (key == "track") {
                      val trackEnabled = sp.getBoolean("track", true)
                      if (trackEnabled) {
                          if (camera == null && checkSelfPermission(Manifest.permission.CAMERA) == PackageManager.PERMISSION_GRANTED) {
                              startCamera()
                          }
                      } else {
                          stopCamera()
                      }
                  }
              }

              override fun onBind(intent: Intent?): IBinder? = null

              private fun applyPrefs() {
                  val sp = getSharedPreferences("robot", MODE_PRIVATE)
                  eyes.eyeColor = EyesView.COLORS[sp.getInt("eye_color", 0).coerceIn(0, EyesView.COLORS.size - 1)]
                  eyes.shape = sp.getInt("eye_shape", 1).coerceIn(0, 2)
                  eyes.sizeScale = sp.getFloat("eye_scale", 1f)
                  
                  params.gravity = Gravity.TOP or Gravity.START
                  params.x = sp.getInt("posx", 300)
                  params.y = sp.getInt("posy", 60)

                  eyes.requestLayout()
                  eyes.invalidate()
                  try {
                      wm.updateViewLayout(eyes, params)
                  } catch (e: Exception) {}
              }

              override fun onCreate() {
                  super.onCreate()
                  val channel = "robot"
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(
                      NotificationChannel(channel, "Robot IA", NotificationManager.IMPORTANCE_LOW)
                  )
                  val notif = Notification.Builder(this, channel)
                      .setContentTitle("Robot IA despierto")
                      .setSmallIcon(android.R.drawable.ic_dialog_info)
                      .build()
                  val prefs = getSharedPreferences("robot", MODE_PRIVATE)
                  val camOk = prefs.getBoolean("track", true) &&
                      checkSelfPermission(Manifest.permission.CAMERA) == PackageManager.PERMISSION_GRANTED
                  if (Build.VERSION.SDK_INT >= 29) {
                      var types = ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE
                      if (Build.VERSION.SDK_INT >= 34) {
                          types = types or ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE
                      }
                      if (camOk) types = types or ServiceInfo.FOREGROUND_SERVICE_TYPE_CAMERA
                      startForeground(1, notif, types)
                  } else {
                      startForeground(1, notif)
                  }

                  tts = TextToSpeech(this) { status ->
                      if (status == TextToSpeech.SUCCESS) {
                          tts?.language = Locale.getDefault()
                          tts?.setOnUtteranceProgressListener(object : UtteranceProgressListener() {
                              override fun onStart(id: String?) {}
                              override fun onDone(id: String?) {
                                  handler.post { eyes.state = EyesView.IDLE }
                              }
                              @Deprecated("Deprecated in Java")
                              override fun onError(id: String?) {
                                  handler.post { eyes.state = EyesView.IDLE }
                              }
                          })
                          ttsReady = true
                      }
                  }

                  wm = getSystemService(WINDOW_SERVICE) as WindowManager
                  params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  )
                  params.gravity = Gravity.TOP or Gravity.START
                  params.x = prefs.getInt("posx", 300)
                  params.y = prefs.getInt("posy", 60)

                  eyes = EyesView(this)
                  var startX = 0
                  var startY = 0
                  var touchX = 0f
                  var touchY = 0f
                  var moved = false
                  
                  eyes.setOnTouchListener { _, e ->
                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> {
                              startX = params.x
                              startY = params.y
                              touchX = e.rawX
                              touchY = e.rawY
                              moved = false
                          }
                          MotionEvent.ACTION_MOVE -> {
                              val dx = (e.rawX - touchX).toInt()
                              val dy = (e.rawY - touchY).toInt()
                              if (abs(dx) > 15 || abs(dy) > 15) moved = true
                              params.x = startX + dx
                              params.y = startY + dy
                              try {
                                  wm.updateViewLayout(eyes, params)
                              } catch (ex: Exception) {}
                          }
                          MotionEvent.ACTION_UP -> {
                              if (!moved) {
                                  onTap()
                              } else {
                                  prefs.edit()
                                      .putInt("posx", params.x)
                                      .putInt("posy", params.y)
                                      .apply()
                              }
                          }
                      }
                      true
                  }
                  wm.addView(eyes, params)
                  applyPrefs()
                  prefs.registerOnSharedPreferenceChangeListener(prefListener)

                  if (camOk) startCamera()
              }

              @Suppress("DEPRECATION")
              private fun startCamera() {
                  try {
                      val cm = getSystemService(CameraManager::class.java)
                      val id = cm.cameraIdList.firstOrNull {
                          cm.getCameraCharacteristics(it).get(CameraCharacteristics.LENS_FACING) ==
                              CameraCharacteristics.LENS_FACING_FRONT
                      } ?: return
                      val ch = cm.getCameraCharacteristics(id)
                      val rot = ch.get(CameraCharacteristics.SENSOR_ORIENTATION) ?: 270
                      val sizes = ch.get(CameraCharacteristics.SCALER_STREAM_CONFIGURATION_MAP)
                          ?.getOutputSizes(ImageFormat.YUV_420_888) ?: return
                      val size = sizes
                          .filter { it.width >= 320 && it.height >= 240 }
                          .minByOrNull { it.width * it.height } ?: sizes.first()
                      val step = maxOf(1, size.width / 320)
                      val ht = HandlerThread("cam")
                      ht.start()
                      camThread = ht
                      val bg = Handler(ht.looper)
                      cm.openCamera(id, object : CameraDevice.StateCallback() {
                          override fun onOpened(cam: CameraDevice) {
                              if (camThread == null) {
                                  cam.close()
                                  return
                              }
                              camera = cam
                              try {
                                  val ir = ImageReader.newInstance(
                                      size.width, size.height, ImageFormat.YUV_420_888, 2
                                  )
                                  reader = ir
                                  ir.setOnImageAvailableListener({ r ->
                                      var img: Image? = null
                                      try {
                                          img = r.acquireLatestImage()
                                          val now = System.currentTimeMillis()
                                          // Optimización de batería: análisis de rostros cada 700ms para menor consumo
                                          if (img != null && now - lastFace >= 700) {
                                              lastFace = now
                                              processImage(img, rot, step)
                                          }
                                      } catch (e: Exception) {
                                      } finally {
                                          img?.close()
                                      }
                                  }, bg)
                                  cam.createCaptureSession(
                                      listOf(ir.surface),
                                      object : CameraCaptureSession.StateCallback() {
                                          override fun onConfigured(s: CameraCaptureSession) {
                                              session = s
                                              try {
                                                  val req = cam.createCaptureRequest(CameraDevice.TEMPLATE_PREVIEW)
                                                  req.addTarget(ir.surface)
                                                  s.setRepeatingRequest(req.build(), null, bg)
                                              } catch (e: Exception) {}
                                          }
                                          override fun onConfigureFailed(s: CameraCaptureSession) {}
                                      },
                                      bg
                                  )
                              } catch (e: Exception) {}
                          }
                          override fun onDisconnected(cam: CameraDevice) { cam.close() }
                          override fun onError(cam: CameraDevice, error: Int) { cam.close() }
                      }, bg)
                  } catch (e: Exception) {}
              }

              private fun processImage(img: Image, rot: Int, step: Int) {
                  val plane = img.planes[0]
                  val buf = plane.buffer
                  val rs = plane.rowStride
                  val ps = plane.pixelStride
                  val sw = img.width / step
                  val sh = img.height / step
                  val sideways = rot == 90 || rot == 270
                  val uw0 = if (sideways) sh else sw
                  val uh = if (sideways) sw else sh
                  val uw = uw0 - uw0 % 2
                  if (uw < 40 || uh < 40) return
                  val px = ShortArray(uw * uh)
                  for (yu in 0 until uh) {
                      for (xu in 0 until uw) {
                          val xs: Int
                          val ys: Int
                          when (rot) {
                              90 -> { xs = yu; ys = sh - 1 - xu }
                              270 -> { xs = sw - 1 - yu; ys = xu }
                              180 -> { xs = sw - 1 - xu; ys = sh - 1 - yu }
                              else -> { xs = xu; ys = yu }
                          }
                          val v = buf.get(ys * step * rs + xs * step * ps).toInt() and 0xFF
                          px[yu * uw + xu] =
                              (((v shr 3) shl 11) or ((v shr 2) shl 5) or (v shr 3)).toShort()
                      }
                  }
                  val bmp = Bitmap.createBitmap(uw, uh, Bitmap.Config.RGB_565)
                  bmp.copyPixelsFromBuffer(ShortBuffer.wrap(px))
                  val cached = detector
                  val det = if (cached != null && detW == uw && detH == uh) {
                      cached
                  } else {
                      FaceDetector(uw, uh, 1).also {
                          detector = it
                          detW = uw
                          detH = uh
                      }
                  }
                  val faces = arrayOfNulls<FaceDetector.Face>(1)
                  val n = det.findFaces(bmp, faces)
                  bmp.recycle()
                  val f = faces[0]
                  val now = System.currentTimeMillis()
                  if (n > 0 && f != null && f.confidence() > 0.4f) {
                      val p = PointF()
                      f.getMidPoint(p)
                      val x = ((0.5f - p.x / uw) * 2f).coerceIn(-1f, 1f)
                      val y = ((p.y / uh - 0.5f) * 2f).coerceIn(-1f, 1f)
                      lastSeen = now
                      handler.post { eyes.lookAt(x, y) }
                  } else if (lastSeen != 0L && now - lastSeen > 3000) {
                      lastSeen = 0L
                      handler.post { eyes.idleLook() }
                  }
              }

              private fun stopCamera() {
                  try { session?.close() } catch (e: Exception) {}
                  try { camera?.close() } catch (e: Exception) {}
                  try { reader?.close() } catch (e: Exception) {}
                  camThread?.quitSafely()
                  session = null
                  camera = null
                  reader = null
                  camThread = null
              }

              private fun onTap() {
                  if (eyes.state == EyesView.IDLE) listen() else stopAll()
              }

              private fun stopAll() {
                  turn++
                  recognizer?.destroy()
                  recognizer = null
                  tts?.stop()
                  eyes.state = EyesView.IDLE
                  pendingAction = null
              }

              private fun listen() {
                  if (!SpeechRecognizer.isRecognitionAvailable(this)) {
                      speak("No tengo reconocimiento de voz en este celular", "triste")
                      return
                  }
                  recognizer?.destroy()
                  val r = SpeechRecognizer.createSpeechRecognizer(this)
                  recognizer = r
                  r.setRecognitionListener(object : RecognitionListener {
                      override fun onReadyForSpeech(p: Bundle?) {}
                      override fun onBeginningOfSpeech() {}
                      override fun onRmsChanged(v: Float) {}
                      override fun onBufferReceived(b: ByteArray?) {}
                      override fun onEndOfSpeech() {}
                      override fun onError(error: Int) { eyes.state = EyesView.IDLE }
                      override fun onResults(res: Bundle?) {
                          val text = res?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)?.firstOrNull()
                          if (text.isNullOrBlank()) eyes.state = EyesView.IDLE else ask(text)
                      }
                      override fun onPartialResults(p: Bundle?) {}
                      override fun onEvent(type: Int, p: Bundle?) {}
                  })
                  val i = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH)
                  i.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                  i.putExtra(RecognizerIntent.EXTRA_LANGUAGE, Locale.getDefault().toLanguageTag())
                  eyes.state = EyesView.LISTENING
                  r.startListening(i)
              }

              private fun msg(role: String, text: String): JSONObject =
                  JSONObject().put("role", role).put("content", text)

              private fun callLlm(msgs: JSONArray): String {
                  val prefs = getSharedPreferences("robot", MODE_PRIVATE)
                  val p = prefs.getString("provider", "groq") ?: "groq"
                  val key = Llm.clean(prefs.getString("key_" + p, "") ?: "")
                  if (key.isBlank()) throw Exception("falta la clave de API en la app")
                  var model = prefs.getString("model_" + p, "") ?: ""
                  if (model.isBlank()) model = Llm.defaultModel(p)

                  // Memoria limitada estrictamente a los últimos 7 días
                  val rawMem = prefs.getString("robot_memory_json", "[]") ?: "[]"
                  val memArray = JSONArray(rawMem)
                  val filteredArray = JSONArray()
                  val sevenDaysMillis = 7L * 24 * 60 * 60 * 1000
                  val now = System.currentTimeMillis()
                  val memoryBuilder = StringBuilder()

                  for (i in 0 until memArray.length()) {
                      val item = memArray.getJSONObject(i)
                      if (now - item.getLong("time") <= sevenDaysMillis) {
                          filteredArray.put(item)
                          memoryBuilder.append(item.getString("text")).append("; ")
                      }
                  }
                  prefs.edit().putString("robot_memory_json", filteredArray.toString()).apply()

                  val savedMemory = memoryBuilder.toString()
                  val fullSystem = if (savedMemory.isNotBlank()) {
                      SYSTEM_BASE + " Recuerdos guardados del usuario (últimos 7 días): " + savedMemory
                  } else {
                      SYSTEM_BASE
                  }

                  return try {
                      Llm.chat(p, key, model, fullSystem, msgs)
                  } catch (e: Llm.LlmError) {
                      if (e.code != 400 && e.code != 404) throw e
                      val m = Llm.pickModel(p, key)
                      if (m == model) throw e
                      prefs.edit().putString("model_" + p, m).apply()
                      Llm.chat(p, key, m, fullSystem, msgs)
                  }
              }

              private fun parseEmotion(reply: String): Pair<String, String> {
                  val m = Regex("^\\s*\\[([^\\]]{1,15})\\]\\s*").find(reply) ?: return Pair("", reply)
                  val raw = Normalizer.normalize(m.groupValues[1].lowercase(), Normalizer.Form.NFD)
                      .replace(Regex("\\p{M}"), "")
                  val idx = EyesView.EXPR_NAMES.indexOfFirst { raw.startsWith(it.take(3)) }
                  val text = reply.substring(m.range.last + 1).ifBlank { reply }
                  return Pair(if (idx >= 0) EyesView.EXPR_NAMES[idx] else "", text)
              }

              private fun parseAction(reply: String): Pair<String?, String> {
                  val actionRegex = Regex("\\[ACCION:([^\\]]+)\\]")
                  val match = actionRegex.find(reply)
                  val action = match?.groupValues?.get(1)
                  val cleanReply = reply.replace(actionRegex, "").trim()
                  return Pair(action, cleanReply)
              }

              private fun parseMemory(reply: String): String {
                  val memRegex = Regex("\\[MEMORIA:([^\\]]+)\\]")
                  val match = memRegex.find(reply)
                  if (match != null) {
                      val newMem = match.groupValues[1]
                      val prefs = getSharedPreferences("robot", MODE_PRIVATE)
                      val rawMem = prefs.getString("robot_memory_json", "[]") ?: "[]"
                      val memArray = JSONArray(rawMem)
                      val newObj = JSONObject().put("time", System.currentTimeMillis()).put("text", newMem)
                      memArray.put(newObj)
                      prefs.edit().putString("robot_memory_json", memArray.toString()).apply()
                  }
                  return reply.replace(memRegex, "").trim()
              }

              private fun executeAction(action: String) {
                  try {
                      val parts = action.split(":")
                      when (parts[0].uppercase()) {
                          "ABRIR" -> {
                              val appName = parts[1].lowercase()
                              val pm = packageManager
                              val packages = pm.getInstalledApplications(0)
                              val target = packages.firstOrNull { 
                                  pm.getApplicationLabel(it).toString().lowercase().contains(appName) 
                              }
                              if (target != null) {
                                  val intent = pm.getLaunchIntentForPackage(target.packageName)
                                  intent?.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                                  startActivity(intent)
                                  speak("Listo, abriendo aplicación", "feliz")
                              } else {
                                  speak("No encontré la aplicación", "triste")
                              }
                          }
                          "ALARMA" -> {
                              val hour = parts[1].toInt()
                              val minute = parts[2].toInt()
                              val intent = Intent(android.provider.AlarmClock.ACTION_SET_ALARM).apply {
                                  putExtra(android.provider.AlarmClock.EXTRA_HOUR, hour)
                                  putExtra(android.provider.AlarmClock.EXTRA_MINUTES, minute)
                                  putExtra(android.provider.AlarmClock.EXTRA_MESSAGE, "Alarma de Robot IA")
                                  putExtra(android.provider.AlarmClock.EXTRA_SKIP_UI, true)
                                  addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                              }
                              startActivity(intent)
                              speak("Alarma programada", "feliz")
                          }
                          "LLAMAR" -> {
                              val contact = parts[1]
                              val intent = Intent(Intent.ACTION_DIAL, Uri.parse("tel:$contact")).apply {
                                  addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                              }
                              startActivity(intent)
                              speak("Abriendo marcador para $contact", "neutral")
                          }
                          "MENSAJE" -> {
                              val contact = parts[1]
                              val message = parts.getOrNull(2) ?: "Hola"
                              val intent = Intent(Intent.ACTION_SENDTO, Uri.parse("smsto:$contact")).apply {
                                  putExtra("sms_body", message)
                                  addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                              }
                              startActivity(intent)
                              speak("Preparando mensaje para $contact", "neutral")
                          }
                      }
                  } catch (e: Exception) {
                      speak("No pude completar la acción", "triste")
                  }
              }

              private fun ask(text: String) {
                  if (pendingAction != null) {
                      val lower = text.lowercase()
                      val confirmed = lower.contains("sí") || lower.contains("si") || lower.contains("claro") || lower.contains("dale") || lower.contains("ok")
                      val act = pendingAction
                      pendingAction = null
                      
                      if (confirmed && act != null) {
                          executeAction(act)
                      } else {
                          speak("Acción cancelada", "neutral")
                      }
                      return
                  }

                  eyes.state = EyesView.THINKING
                  history.put(msg("user", text))
                  val prefs = getSharedPreferences("robot", MODE_PRIVATE)
                  val msgs = JSONArray(history.toString())
                  val mine = ++turn
                  Thread {
                      var err: String? = null
                      val reply = try {
                          callLlm(msgs)
                      } catch (e: Exception) {
                          err = e.message ?: "error desconocido"
                          "Tuve un problema. Mira el mensaje en pantalla."
                      }
                      handler.post {
                          if (mine == turn) {
                              val f = err
                              if (f == null) {
                                  history.put(msg("assistant", reply))
                                  prefs.edit().remove("lasterror").apply()
                              } else {
                                  history.remove(history.length() - 1)
                                  prefs.edit().putString("lasterror", f).apply()
                                  Toast.makeText(this, f, Toast.LENGTH_LONG).show()
                              }
                              while (history.length() > 20) {
                                  history.remove(0)
                                  history.remove(0)
                              }
                              if (f == null) {
                                  val cleanReply = parseMemory(reply)
                                  val parsedEmotion = parseEmotion(cleanReply)
                                  val parsedAction = parseAction(parsedEmotion.second)
                                  
                                  if (parsedAction.first != null) {
                                      pendingAction = parsedAction.first
                                      speak("¿Confirmas que quieres que haga eso? Dime sí o no.", "sorprendido")
                                  } else {
                                      speak(parsedAction.second, parsedEmotion.first)
                                  }
                              } else {
                                  speak(reply, "triste")
                              }
                          }
                      }
                  }.start()
              }

              private fun speak(text: String, emo: String = "") {
                  eyes.state = EyesView.SPEAKING
                  val idx = EyesView.EXPR_NAMES.indexOf(emo)
                  eyes.expression = if (idx > 0) idx else 0
                  tts?.speak(text, TextToSpeech.QUEUE_FLUSH, null, "robot")
              }

              override fun onDestroy() {
                  turn++
                  getSharedPreferences("robot", MODE_PRIVATE).unregisterOnSharedPreferenceChangeListener(prefListener)
                  stopCamera()
                  recognizer?.destroy()
                  tts?.shutdown()
                  if (::eyes.isInitialized) {
                      eyes.stopBlinking()
                      wm.removeView(eyes)
                  }
                  super.onDestroy()
              }
          }
          EOF

          cat > app/src/main/java/com/robotia/app/MainActivity.kt <<'EOF'
          package com.robotia.app

          import android.Manifest
          import android.app.Activity
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Typeface
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.speech.tts.TextToSpeech
          import android.text.InputType
          import android.view.Gravity
          import android.widget.ArrayAdapter
          import android.widget.Button
          import android.widget.CheckBox
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.Spinner
          import android.widget.TextView
          import org.json.JSONArray
          import org.json.JSONObject
          import java.util.Locale

          class MainActivity : Activity() {
              private lateinit var result: TextView
              private val prefs by lazy { getSharedPreferences("robot", MODE_PRIVATE) }
              private val providers = listOf("groq", "mistral")
              private var current: String? = null

              override fun onResume() {
                  super.onResume()
                  val err = prefs.getString("lasterror", "") ?: ""
                  if (err.isNotBlank()) result.text = "Error: " + err
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val perms = mutableListOf(
                      Manifest.permission.RECORD_AUDIO,
                      Manifest.permission.CAMERA,
                      Manifest.permission.CALL_PHONE,
                      Manifest.permission.SEND_SMS
                  )
                  if (Build.VERSION.SDK_INT >= 33) perms.add("android.permission.POST_NOTIFICATIONS")
                  requestPermissions(perms.toTypedArray(), 1)

                  val pad = (24 * resources.displayMetrics.density).toInt()
                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER_HORIZONTAL
                      setPadding(pad, pad, pad, pad)
                  }

                  fun title(t: String) {
                      layout.addView(TextView(this).apply {
                          text = t
                          textSize = 18f
                          typeface = Typeface.DEFAULT_BOLD
                          setPadding(0, pad, 0, 0)
                      })
                  }

                  val info = TextView(this).apply {
                      text = "🤖 Robot IA - Configuración\n\n1. Selecciona tu proveedor e ingresa tu clave API.\n2. Los cambios de clave o proveedor solo se permiten 1 vez cada 7 días por seguridad.\n3. Usa los botones inferiores para controlar el servicio."
                  }
                  
                  val spinner = Spinner(this)
                  spinner.adapter = ArrayAdapter(
                      this,
                      android.R.layout.simple_spinner_dropdown_item,
                      listOf("Groq (Recomendado)", "Mistral")
                  )
                  
                  val keyBox = EditText(this).apply {
                      hint = "Clave de API personal"
                      inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_VARIATION_PASSWORD
                  }
                  val modelBox = EditText(this).apply { hint = "Modelo (automático)" }

                  // Control estricto de modificación: Permitir cambios solo 1 vez a la semana (7 días)
                  val lastChangeTime = prefs.getLong("last_config_change", 0L)
                  val sevenDaysMillis = 7L * 24 * 60 * 60 * 1000
                  val now = System.currentTimeMillis()
                  val canModify = (now - lastChangeTime) > sevenDaysMillis

                  if (!canModify) {
                      val daysLeft = ((sevenDaysMillis - (now - lastChangeTime)) / (1000 * 60 * 60 * 24)).toInt()
                      keyBox.isEnabled = false
                      spinner.isEnabled = false
                      modelBox.isEnabled = false
                  }

                  val track = CheckBox(this).apply {
                      text = "Seguir mi cara con cámara frontal (Modo Activo)"
                      isChecked = prefs.getBoolean("track", true)
                      setOnCheckedChangeListener { _, on ->
                          prefs.edit().putBoolean("track", on).apply()
                      }
                  }

                  result = TextView(this).apply { setPadding(0, 10, 0, 10) }
                  val test = Button(this).apply { text = "Probar Clave API" }
                  
                  // Únicos 2 botones principales solicitados: Apagar/Encender Robot y Cámara de seguimiento
                  val start = Button(this).apply { text = "🟢 Encender Robot IA" }
                  val stop = Button(this).apply { text = "🔴 Apagar Robot IA" }

                  fun saveCurrent() {
                      if (!canModify) return // Bloqueado por regla de 7 días
                      prefs.edit().putBoolean("track", track.isChecked).apply()
                      val c = current ?: return
                      prefs.edit()
                          .putString("key_" + c, Llm.clean(keyBox.text.toString()))
                          .putString("model_" + c, modelBox.text.toString().trim())
                          .putString("provider", c)
                          .putLong("last_config_change", System.currentTimeMillis())
                          .apply()
                  }

                  spinner.onItemSelectedListener = object : android.widget.AdapterView.OnItemSelectedListener {
                      override fun onItemSelected(parent: android.widget.AdapterView<*>, v: View?, pos: Int, id: Long) {
                          val p = providers[pos]
                          current = p
                          keyBox.setText(prefs.getString("key_" + p, ""))
                          modelBox.setText(prefs.getString("model_" + p, ""))
                          modelBox.hint = Llm.defaultModel(p)
                      }
                      override fun onNothingSelected(parent: android.widget.AdapterView<*>) {}
                  }
                  val saved = prefs.getString("provider", "groq") ?: "groq"
                  spinner.setSelection(providers.indexOf(saved).coerceAtLeast(0))

                  test.setOnClickListener {
                      saveCurrent()
                      val p = current ?: "groq"
                      val key = Llm.clean(keyBox.text.toString())
                      val typed = modelBox.text.toString().trim()
                      result.text = "Probando conexión..."
                      Thread {
                          val out = try {
                              val q = JSONArray().put(JSONObject().put("role", "user").put("content", "Hola"))
                              var m = typed.ifBlank { Llm.defaultModel(p) }
                              val r = try {
                                  Llm.chat(p, key, m, "Responde en espanol", q)
                              } catch (e: Llm.LlmError) {
                                  if (e.code != 400 && e.code != 404) throw e
                                  m = Llm.pickModel(p, key)
                                  Llm.chat(p, key, m, "Responde en espanol", q)
                              }
                              prefs.edit().putString("model_" + p, m).remove("lasterror").apply()
                              runOnUiThread { modelBox.setText(m) }
                              "¡Conexión exitosa con $p!"
                          } catch (e: Exception) {
                              "Error: " + e.message
                          }
                          runOnUiThread { result.text = out }
                      }.start()
                  }

                  start.setOnClickListener {
                      saveCurrent()
                      if (!Settings.canDrawOverlays(this)) {
                          startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                      } else if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                          requestPermissions(arrayOf(Manifest.permission.RECORD_AUDIO, Manifest.permission.CAMERA), 2)
                      } else {
                          startForegroundService(Intent(this, OverlayService::class.java))
                          result.text = "Robot IA encendido en pantalla."
                      }
                  }

                  stop.setOnClickListener {
                      stopService(Intent(this, OverlayService::class.java))
                      result.text = "Robot IA apagado."
                  }

                  layout.addView(info)
                  if (!canModify) {
                      layout.addView(TextView(this).apply {
                          text = "⚠️ Llave bloqueada temporalmente. Podrás cambiarla nuevamente después de que se cumpla el ciclo de 7 días."
                          setTextColor(android.graphics.Color.RED)
                      })
                  }
                  layout.addView(spinner)
                  layout.addView(keyBox)
                  layout.addView(modelBox)
                  layout.addView(track)
                  layout.addView(test)
                  layout.addView(result)
                  layout.addView(start)
                  layout.addView(stop)

                  setContentView(ScrollView(this).apply { addView(layout) })
              }
          }
