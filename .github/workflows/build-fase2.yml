name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Generar proyecto Android
        run: |
          mkdir -p app/src/main/java/com/robotia/app

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "RobotIA"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.robotia.app"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.robotia.app"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 2
                  versionName = "0.2"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <queries>
                  <intent><action android:name="android.speech.RecognitionService"/></intent>
                  <intent><action android:name="android.intent.action.TTS_SERVICE"/></intent>
              </queries>
              <application
                  android:label="Robot IA"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".OverlayService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse|microphone">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="overlay"/>
                  </service>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/robotia/app/MainActivity.kt <<'EOF'
          package com.robotia.app

          import android.Manifest
          import android.app.Activity
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.text.InputType
          import android.view.Gravity
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.TextView

          class MainActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val perms = mutableListOf(Manifest.permission.RECORD_AUDIO)
                  if (Build.VERSION.SDK_INT >= 33) perms.add("android.permission.POST_NOTIFICATIONS")
                  requestPermissions(perms.toTypedArray(), 1)

                  val prefs = getSharedPreferences("robot", MODE_PRIVATE)
                  val pad = (24 * resources.displayMetrics.density).toInt()
                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setPadding(pad, pad, pad, pad)
                  }
                  val info = TextView(this).apply {
                      text = "Pega tu clave de API de Anthropic (se guarda solo en este celular). Luego despierta los ojos y tocalos para hablar."
                  }
                  val keyBox = EditText(this).apply {
                      hint = "sk-ant-..."
                      inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_VARIATION_PASSWORD
                      setText(prefs.getString("key", ""))
                  }
                  val start = Button(this).apply { text = "Despertar ojos" }
                  val stop = Button(this).apply { text = "Dormir ojos" }

                  start.setOnClickListener {
                      prefs.edit().putString("key", keyBox.text.toString().trim()).apply()
                      if (!Settings.canDrawOverlays(this)) {
                          startActivity(
                              Intent(
                                  Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                                  Uri.parse("package:$packageName")
                              )
                          )
                      } else if (checkSelfPermission(Manifest.permission.RECORD_AUDIO)
                          != PackageManager.PERMISSION_GRANTED
                      ) {
                          requestPermissions(arrayOf(Manifest.permission.RECORD_AUDIO), 2)
                      } else {
                          startForegroundService(Intent(this, OverlayService::class.java))
                      }
                  }
                  stop.setOnClickListener {
                      stopService(Intent(this, OverlayService::class.java))
                  }
                  layout.addView(info)
                  layout.addView(keyBox)
                  layout.addView(start)
                  layout.addView(stop)
                  setContentView(layout)
              }
          }
          EOF

          cat > app/src/main/java/com/robotia/app/OverlayService.kt <<'EOF'
          package com.robotia.app

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.PixelFormat
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.speech.RecognitionListener
          import android.speech.RecognizerIntent
          import android.speech.SpeechRecognizer
          import android.speech.tts.TextToSpeech
          import android.speech.tts.UtteranceProgressListener
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.WindowManager
          import org.json.JSONArray
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          import java.util.Locale
          import kotlin.math.abs

          class OverlayService : Service() {
              companion object {
                  const val MODEL = "claude-haiku-5-5"
                  const val SYSTEM = "Eres Robot IA, un asistente que vive en el celular del usuario como dos ojos flotantes. Responde en espanol, en una o dos frases cortas, porque tus respuestas se leen en voz alta. No uses listas ni simbolos."
              }

              private lateinit var wm: WindowManager
              private lateinit var eyes: EyesView
              private val handler = Handler(Looper.getMainLooper())
              private var recognizer: SpeechRecognizer? = null
              private var tts: TextToSpeech? = null
              private val history = JSONArray()
              private var turn = 0

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  val channel = "robot"
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(
                      NotificationChannel(channel, "Robot IA", NotificationManager.IMPORTANCE_LOW)
                  )
                  val notif = Notification.Builder(this, channel)
                      .setContentTitle("Robot IA despierto")
                      .setSmallIcon(android.R.drawable.ic_dialog_info)
                      .build()
                  if (Build.VERSION.SDK_INT >= 34) {
                      startForeground(
                          1, notif,
                          ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE or
                              ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE
                      )
                  } else {
                      startForeground(1, notif)
                  }

                  tts = TextToSpeech(this) { status ->
                      if (status == TextToSpeech.SUCCESS) {
                          tts?.language = Locale.getDefault()
                          tts?.setOnUtteranceProgressListener(object : UtteranceProgressListener() {
                              override fun onStart(id: String?) {}
                              override fun onDone(id: String?) {
                                  handler.post { eyes.state = EyesView.IDLE }
                              }
                              @Deprecated("Deprecated in Java")
                              override fun onError(id: String?) {
                                  handler.post { eyes.state = EyesView.IDLE }
                              }
                          })
                      }
                  }

                  wm = getSystemService(WINDOW_SERVICE) as WindowManager
                  val params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  )
                  params.gravity = Gravity.TOP or Gravity.START
                  params.x = 300
                  params.y = 60

                  eyes = EyesView(this)
                  var startX = 0
                  var startY = 0
                  var touchX = 0f
                  var touchY = 0f
                  var moved = false
                  eyes.setOnTouchListener { _, e ->
                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> {
                              startX = params.x
                              startY = params.y
                              touchX = e.rawX
                              touchY = e.rawY
                              moved = false
                          }
                          MotionEvent.ACTION_MOVE -> {
                              val dx = (e.rawX - touchX).toInt()
                              val dy = (e.rawY - touchY).toInt()
                              if (abs(dx) > 15 || abs(dy) > 15) moved = true
                              params.x = startX + dx
                              params.y = startY + dy
                              wm.updateViewLayout(eyes, params)
                          }
                          MotionEvent.ACTION_UP -> {
                              if (!moved) onTap()
                          }
                      }
                      true
                  }
                  wm.addView(eyes, params)
              }

              private fun onTap() {
                  if (eyes.state == EyesView.IDLE) listen() else stopAll()
              }

              private fun stopAll() {
                  turn++
                  recognizer?.destroy()
                  recognizer = null
                  tts?.stop()
                  eyes.state = EyesView.IDLE
              }

              private fun listen() {
                  if (!SpeechRecognizer.isRecognitionAvailable(this)) {
                      speak("No tengo reconocimiento de voz en este celular")
                      return
                  }
                  recognizer?.destroy()
                  val r = SpeechRecognizer.createSpeechRecognizer(this)
                  recognizer = r
                  r.setRecognitionListener(object : RecognitionListener {
                      override fun onReadyForSpeech(p: Bundle?) {}
                      override fun onBeginningOfSpeech() {}
                      override fun onRmsChanged(v: Float) {}
                      override fun onBufferReceived(b: ByteArray?) {}
                      override fun onEndOfSpeech() {}
                      override fun onError(error: Int) {
                          eyes.state = EyesView.IDLE
                      }
                      override fun onResults(res: Bundle?) {
                          val text = res
                              ?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)
                              ?.firstOrNull()
                          if (text.isNullOrBlank()) {
                              eyes.state = EyesView.IDLE
                          } else {
                              ask(text)
                          }
                      }
                      override fun onPartialResults(p: Bundle?) {}
                      override fun onEvent(type: Int, p: Bundle?) {}
                  })
                  val i = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH)
                  i.putExtra(
                      RecognizerIntent.EXTRA_LANGUAGE_MODEL,
                      RecognizerIntent.LANGUAGE_MODEL_FREE_FORM
                  )
                  i.putExtra(RecognizerIntent.EXTRA_LANGUAGE, Locale.getDefault().toLanguageTag())
                  eyes.state = EyesView.LISTENING
                  r.startListening(i)
              }

              private fun ask(text: String) {
                  eyes.state = EyesView.THINKING
                  history.put(JSONObject().put("role", "user").put("content", text))
                  val key = getSharedPreferences("robot", MODE_PRIVATE).getString("key", "") ?: ""
                  val msgs = JSONArray(history.toString())
                  val mine = ++turn
                  Thread {
                      var ok = true
                      val reply = try {
                          callClaude(key, msgs)
                      } catch (e: Exception) {
                          ok = false
                          "Tuve un problema: " + e.message
                      }
                      handler.post {
                          if (mine == turn) {
                              if (ok) {
                                  history.put(
                                      JSONObject().put("role", "assistant").put("content", reply)
                                  )
                              } else {
                                  history.remove(history.length() - 1)
                              }
                              while (history.length() > 20) {
                                  history.remove(0)
                                  history.remove(0)
                              }
                              speak(reply)
                          }
                      }
                  }.start()
              }

              private fun callClaude(key: String, msgs: JSONArray): String {
                  if (key.isBlank()) throw Exception("falta la clave de API en la app")
                  val body = JSONObject()
                      .put("model", MODEL)
                      .put("max_tokens", 300)
                      .put("system", SYSTEM)
                      .put("messages", msgs)
                  val c = URL("https://api.anthropic.com/v1/messages").openConnection() as HttpURLConnection
                  c.requestMethod = "POST"
                  c.connectTimeout = 15000
                  c.readTimeout = 30000
                  c.setRequestProperty("content-type", "application/json")
                  c.setRequestProperty("x-api-key", key)
                  c.setRequestProperty("anthropic-version", "2023-06-01")
                  c.doOutput = true
                  c.outputStream.use { it.write(body.toString().toByteArray()) }
                  val code = c.responseCode
                  if (code !in 200..299) {
                      throw Exception(
                          when (code) {
                              401 -> "la clave de API no es valida"
                              404 -> "no encuentro el modelo"
                              429 -> "me pase del limite de uso"
                              else -> "error " + code
                          }
                      )
                  }
                  val txt = c.inputStream.bufferedReader().use { it.readText() }
                  val arr = JSONObject(txt).getJSONArray("content")
                  val sb = StringBuilder()
                  for (n in 0 until arr.length()) {
                      val b = arr.getJSONObject(n)
                      if (b.optString("type") == "text") sb.append(b.optString("text"))
                  }
                  return sb.toString().ifBlank { "No supe que responder" }
              }

              private fun speak(text: String) {
                  eyes.state = EyesView.SPEAKING
                  tts?.speak(text, TextToSpeech.QUEUE_FLUSH, null, "robot")
              }

              override fun onDestroy() {
                  turn++
                  recognizer?.destroy()
                  tts?.shutdown()
                  if (::eyes.isInitialized) {
                      eyes.stopBlinking()
                      wm.removeView(eyes)
                  }
                  super.onDestroy()
              }
          }
          EOF

          cat > app/src/main/java/com/robotia/app/EyesView.kt <<'EOF'
          package com.robotia.app

          import android.animation.ValueAnimator
          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Color
          import android.graphics.Paint
          import android.os.Handler
          import android.os.Looper
          import android.view.View

          class EyesView(ctx: Context) : View(ctx) {
              companion object {
                  const val IDLE = 0
                  const val LISTENING = 1
                  const val THINKING = 2
                  const val SPEAKING = 3
              }

              private val white = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.WHITE }
              private val pupil = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.rgb(20, 20, 40) }
              private val bg = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.argb(230, 15, 15, 30) }
              private val density = ctx.resources.displayMetrics.density
              private var open = 1f
              private var look = 0f
              private val handler = Handler(Looper.getMainLooper())

              var state = IDLE
                  set(v) {
                      field = v
                      pupil.color = when (v) {
                          LISTENING -> Color.rgb(30, 120, 255)
                          THINKING -> Color.rgb(255, 170, 0)
                          SPEAKING -> Color.rgb(0, 170, 90)
                          else -> Color.rgb(20, 20, 40)
                      }
                      invalidate()
                  }

              private val loop = object : Runnable {
                  override fun run() {
                      val a = ValueAnimator.ofFloat(1f, 0.05f, 1f)
                      a.duration = 220
                      a.addUpdateListener {
                          open = it.animatedValue as Float
                          invalidate()
                      }
                      a.start()
                      look = (-1..1).random().toFloat()
                      handler.postDelayed(this, (2500..5500).random().toLong())
                  }
              }

              init {
                  handler.post(loop)
              }

              fun stopBlinking() {
                  handler.removeCallbacks(loop)
              }

              override fun onMeasure(w: Int, h: Int) {
                  setMeasuredDimension((150 * density).toInt(), (70 * density).toInt())
              }

              override fun onDraw(c: Canvas) {
                  val w = width.toFloat()
                  val h = height.toFloat()
                  c.drawRoundRect(0f, 0f, w, h, h / 2, h / 2, bg)
                  val r = h * 0.32f
                  val pr = if (state == LISTENING) r * 0.65f else r * 0.5f
                  val cy = h / 2
                  for (cx in floatArrayOf(w * 0.3f, w * 0.7f)) {
                      c.save()
                      c.scale(1f, open, cx, cy)
                      c.drawCircle(cx, cy, r, white)
                      c.drawCircle(cx + look * r * 0.35f, cy, pr, pupil)
                      c.restore()
                  }
              }
          }
          EOF

      - name: Compilar APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: robot-ia-apk
          path: app/build/outputs/apk/debug/app-debug.apk
